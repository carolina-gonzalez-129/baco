[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baco"
version = "0.1.0"
description = "BACO - Asistente de Base de Conocimiento Finnegans"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-agents[openai]>=1.0.0",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "python-multipart",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",
    "onnxruntime>=1.18.0",
    "beautifulsoup4",
    "sentence-transformers[onnx]>=3.0.0",
    "tqdm",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "respx>=0.23.0",
    "testcontainers[postgres]>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["baco*"]

[tool.setuptools.package-data]
baco = ["skills/**/*.md", "server/db/*.sql"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that exercise external services or real ML models",
    "slow: marks tests as slow (ONNX model parity, heavy models, etc.)",
]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]
